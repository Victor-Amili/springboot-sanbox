spring:
  application:
    name: mysqlapp


  datasource:
    url: jdbc:mysql://localhost:3306/mysqlapp
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

